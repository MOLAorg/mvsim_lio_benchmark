# -----------------------------------------------------------------------------
# DLIO on the MVSim LIO benchmark: upstream's own defaults (cfg/dlio.yaml +
# cfg/params.yaml), with this benchmark's sensor description.
# -----------------------------------------------------------------------------

lidar_sensor_label: "lidar1"
imu_sensor_label: "imu1"

# T_lidar_imu: pose of the IMU frame wrt the LiDAR frame.
# rigs/: lidar1 at (0, 0, 0.75) m and imu1 at (0.05, -0.03, 0.45) m in base_link.
imu_pose_in_lidar_str: "0.05 -0.03 -0.30 0 0 0"

# T_base_lidar: pose of the LiDAR frame wrt base_link, the frame of the ground truth.
baselink2lidar_pose_str: "0 0 0.75 0 0 0"
ignore_point_timestamps: ${BENCH_IGNORE_POINT_STAMPS|false}

# Sweep period, used only for clouds without per-point times.
fallback_scan_period: 0.1

# DLIO's own near-field cut (params.yaml: preprocessing.cropBoxFilter.size):
# a symmetric box of *half*-extent this value (side length 2x) centered on
# base_link. Upstream default.
crop_box_size: ${DLIO_CROPBOX_SIZE|1.0}
# Separate to the crop box: `blind` is this *module's* own MRPT-adapter
# point cull (radius, applied before points even reach dlio_core), kept at 0
# here since the crop box above already does the near-field cut DLIO's own
# way; set > 0 to stack an additional cull if ever needed.
blind: 0.0

adaptive: true
pointcloud_deskew: ${BENCH_DESKEW|true}
pointcloud_voxelize: true
voxel_filter_res: ${DLIO_VOXEL_RES|0.25}

gravity: 9.80665
compute_time_offset: true

# IMU calibration: gyro/accel biases and the initial gravity-aligned
# orientation from a startup window, as upstream does by default.
imu_calibrate: ${DLIO_IMU_CALIBRATE|true}
imu_approximate_gravity: ${DLIO_IMU_APPROXIMATE_GRAVITY|true}
imu_calibrate_gyro: true
imu_calibrate_accel: true
# Upstream's 3 s default.
imu_calib_time_sec: ${DLIO_IMU_CALIB_TIME_SEC|3.0}
imu_buffer_size: 5000

keyframe_thresh_dist: ${DLIO_KEYFRAME_THRESH_D|1.0}
keyframe_thresh_rot: ${DLIO_KEYFRAME_THRESH_R|45.0}

submap_knn: ${DLIO_SUBMAP_K|10}
submap_kcv: ${DLIO_SUBMAP_K|10}
submap_kcc: ${DLIO_SUBMAP_K|10}

gicp_min_num_points: 64
gicp_k_correspondences: 16
gicp_max_corr_dist: ${DLIO_GICP_MAX_CORR_DIST|0.5}
gicp_max_iterations: 32
gicp_transformation_epsilon: 0.01
gicp_rotation_epsilon: 0.01
gicp_init_lambda_factor: 1e-9

# Geometric observer gains: upstream defaults.
geo_Kp: 4.5
geo_Kv: 11.25
geo_Kq: ${DLIO_GEO_KQ|4.0}
geo_Kab: ${DLIO_GEO_KAB|2.25}
geo_Kgb: 1.0
geo_abias_max: 5.0
geo_gbias_max: 0.5

map_sparse_leaf_size: 0.25
wait_until_move: false
dense_map_filtered: false

# --- Visualization ---
show_trajectory: true
show_submap: true
camera_follows_vehicle: true
current_pose_corner_size: 1.0
submap_point_size: 2.0
map_update_decimation: 10

# --- Estimated trajectory output ---
# Dumped to disk on shutdown when enabled -- mirrors mola_lidar_odometry's
# `estimated_trajectory` pipeline block (same env var names), needed so
# `mola-cli` (online mode) can export a trajectory the same way the offline
# `mola-dlio-cli` app already does via its own `--output-tum-path` flag.
save_trajectory_to_file: ${MOLA_SAVE_TRAJECTORY|false}
trajectory_output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.tum'}
